[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcc-console"
version = "1.0.0"
description = "Test console for the DCC Enablement Configuration stored procedure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Planet" }]
keywords = ["dcc", "payments", "sql-server", "streamlit", "qa"]

dependencies = [
    "streamlit==1.40.2",
    "pyodbc==5.0.1",
    "pandas==2.0.3",
    "numpy<2",
    "python-dotenv==1.0.0",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
]

[project.scripts]
dcc-console = "dcc_console.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
